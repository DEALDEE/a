👍 ขุมพลังเครื่องยนต์ Dual VVT-i 1.6 ลิตร ทนทาน ไม่จุกจิก และประหยัดน้ำมันเป็นเลิศ:
• เครื่องยนต์เบนซิน 4 สูบแถวเรียง DOHC 16 วาล์ว Dual VVT-i ขนาด 1.6 ลิตร (1,598 ซีซี)
• มอบพละกำลังสูงสุด 125 แรงม้า ที่ 6,050 รอบ/นาที และแรงบิดสูงสุด 156 นิวตัน-เมตร ที่ 5,200 รอบ/นาที ตอบสนองอัตราเร่งลื่นไหล ขับสนุกในเมืองและเดินทางไกล
• จับคู่กับเกียร์อัตโนมัติ Super CVT-i 7 สปีด พร้อม Sequential Shift ให้ผู้ขับขี่เลือกเปลี่ยนเกียร์ได้เอง เปลี่ยนเกียร์นุ่มนวล สมูท และประหยัดน้ำมัน
• โครงสร้างสร้างขึ้นบนสถาปัตยกรรมยานยนต์ใหม่ TNGA (Toyota New Global Architecture) ให้จุดศูนย์ถ่วงต่ำลง เพิ่มการยึดเกาะถนน ทรงตัวเยี่ยม และเข้าโค้งได้อย่างมั่นใจ
• รองรับน้ำมันพลังงานทางเลือกสูงสุดถึง E85 ช่วยเซฟค่าใช้จ่ายในการเดินทางได้อย่างยอดเยี่ยม
• ขึ้นชื่อเรื่องความทนทาน เครื่องยนต์อึด ถึก ทน ซ่อมบำรุงง่าย อะไหล่หาง่าย และศูนย์บริการครอบคลุมทั่วประเทศ

👍 ดีไซน์ภายนอกสปอร์ตพรีเมียม โฉบเฉี่ยว ทันสมัย:
• ตัวถังสีบรอนซ์เงิน (Silver Metallic) สียอดนิยม หรูหรา สะอาดตา ไม่ฟ้องฝุ่น ดูแลรักษาง่าย
• กระจังหน้าดีไซน์สปอร์ตตกแต่งด้วยวัสดุสีดำเงาและโครเมียม
• ชุดไฟหน้าแบบ Halogen Projector พร้อมไฟส่องสว่างเวลากลางวัน Daytime Running Lights แบบ LED
• ไฟท้ายแบบ LED Light Guiding ดีไซน์สปอร์ต คมชัด ส่องสว่างโดดเด่นยามค่ำคืน
• กระจกมองข้างปรับและพับด้วยระบบไฟฟ้า พร้อมไฟเลี้ยว LED ในตัว
• มือจับประตูด้านนอกตกแต่งด้วยโครเมียมเพิ่มความหรูหรา
• ล้ออัลลอยแท้ดีไซน์สปอร์ตจากโรงงานขนาด 16 นิ้ว สวยงามลงตัว

👍 ห้องโดยสารกว้างขวาง นั่งสบาย อุปกรณ์อำนวยความสะดวกครบครัน:
• ห้องโดยสารโทนสีดำสปอร์ต ตกแต่งด้วยดีไซน์พรีเมียม บุนุ่มด้วยวัสดุ Soft Touch คุณภาพสูง
• เบาะนั่งหุ้มด้วยหนังแท้และวัสดุสังเคราะห์สีดำ นั่งสบาย โอบกระชับสรีระ ดูแลทำความสะอาดง่าย
• พวงมาลัยมัลติฟังก์ชันหุ้มหนังแท้ ปรับระดับได้ 4 ทิศทาง พร้อมปุ่มควบคุมเครื่องเสียงและหน้าจอ MID
• มาตรวัดความเร็วพร้อมหน้าจอแสดงข้อมูลการขับขี่แบบดิจิทัล TFT ขนาด 4.2 นิ้ว อ่านง่าย ชัดเจน
• ระบบเครื่องเสียงหน้าจอสัมผัส รองรับวิทยุ FM/AM, MP3, ช่องเชื่อมต่อ USB และระบบเชื่อมต่อไร้สาย Bluetooth
• ระบบปรับอากาศแบบอัตโนมัติ (Auto) พร้อม ช่องแอร์สำหรับผู้โดยสารตอนหลัง กระจายความเย็นฉ่ำทั่วคัน
• ระบบกุญแจอัจฉริยะ Smart Entry พร้อมปุ่มสตาร์ทเครื่องยนต์ Push Start Button
• เบรกมือไฟฟ้า (Electric Parking Brake) พร้อมระบบ Auto Brake Hold เพิ่มความสบายยามรถติด

👍 ระบบเทคโนโลยีความปลอดภัยมาตรฐานระดับสากล อุ่นใจทุกการเดินทาง:
• ถุงลมนิรภัย SRS จัดเต็มรอบคัน 7 ตำแหน่ง (คู่หน้า, ด้านข้าง, ม่านถุงลม, และหัวเข่าฝั่งคนขับ)
• ระบบเบรกป้องกันล้อล็อก ABS (Anti-lock Braking System) พร้อมระบบกระจายแรงเบรก EBD และระบบเสริมแรงเบรก BA
• ระบบควบคุมการทรงตัว VSC (Vehicle Stability Control)
• ระบบป้องกันล้อหมุนฟรี TRC (Traction Control)
• ระบบช่วยออกตัวบนทางลาดชัน HSA (Hill-start Assist Control)
• ระบบสัญญาณไฟฉุกเฉินเมื่อเบรกกะทันหัน EBS (Emergency Brake Signal)
• เซนเซอร์กะระยะช่วยจอดด้านหลัง
• โครงสร้างตัวถังนิรภัย TNGA ป้องกันและดูดซับแรงกระแทกได้อย่างยอดเยี่ยม
• กุญแจนิรภัย Immobilizer พร้อมระบบสัญญาณกันขโมย
