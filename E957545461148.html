🧡 ราคา 599,000 บาท 🧡

👍 ขุมพลังเครื่องยนต์ VTEC TURBO 1.5 ลิตร สมรรถนะสปอร์ต เร่งแซงทันใจ และประหยัดน้ำมัน:
• เครื่องยนต์เบนซิน รหัส L15B7 4 สูบ DOHC 16 วาล์ว VTEC TURBO ขนาด 1.5 ลิตร (1,498 ซีซี)
• มอบพละกำลังสูงสุด 173 แรงม้า ที่ 5,500 รอบ/นาที และแรงบิดมหาศาล 220 นิวตัน-เมตร ที่ 1,700 – 5,500 รอบ/นาที อัตราเร่งดีเยี่ยม ขับสนุกเร้าใจทุกย่านความเร็ว
• จับคู่กับเกียร์อัตโนมัติ CVT พัฒนาภายใต้เทคโนโลยี Earth Dreams ตอบสนองอัตราเร่งได้ต่อเนื่อง ลื่นไหล นุ่มนวล และประหยัดน้ำมัน
• แป้นเปลี่ยนเกียร์ที่พวงมาลัย Paddle Shift เพิ่มความสนุกในการขับขี่สไตล์สปอร์ต
• รองรับน้ำมันพลังงานทางเลือก E20 ช่วยเซฟค่าใช้จ่ายในการเดินทาง
• พวงมาลัยเพาเวอร์ไฟฟ้า DP-EPS น้ำหนักแม่นยำ คมกริบ และตอบสนองได้อย่างมั่นใจ

👍 ดีไซน์ภายนอกสปอร์ตดุดัน เอกลักษณ์เฉพาะรุ่น TURBO RS:
• ตัวถังสีบรอนซ์เงิน (Lunar Silver Metallic) โฉบเฉี่ยว ดูแลรักษาง่าย ไม่ฟ้องฝุ่น
• ชุดแต่งสปอร์ต RS รอบคัน พร้อมกระจังหน้าสีดำเงา (Piano Black) เอกลักษณ์เฉพาะตัว
• ชุดไฟหน้าแบบ Full LED ดีไซน์สปอร์ต พร้อมไฟส่องสว่างเวลากลางวัน Daytime Running Lights แบบ LED และไฟตัดหมอกคู่หน้าแบบ LED
• สปอยเลอร์หลังพร้อมไฟเบรกดวงที่ 3 และท่อไอเสียคู่แบบสปอร์ต
• กระจกมองข้างปรับและพับไฟฟ้า พร้อมไฟเลี้ยว LED ในตัว
• มือจับประตูด้านนอกตกแต่งด้วยโครเมียมรมดำ (Dark Chrome)
• ล้ออัลลอยแท้ดีไซน์สปอร์ตเฉพาะรุ่น RS ขนาด 17 นิ้ว สวยงามลงตัว

👍 ห้องโดยสารดีไซน์สปอร์ตพรีเมียม สิ่งอำนวยความสะดวกครบครัน:
• ห้องโดยสารโทนสีดำสปอร์ต เดินด้ายแดงบริเวณเบาะนั่ง พวงมาลัย และแผงประตูเพิ่มความเร้าใจ
• เบาะนั่งหุ้มด้วยหนังแท้สีดำคุณภาพสูง
• เบาะนั่งคนขับปรับไฟฟ้า 8 ทิศทาง และเบาะผู้โดยสารตอนหน้าปรับไฟฟ้า 4 ทิศทาง
• พวงมาลัยมัลติฟังก์ชันหุ้มหนังแท้เดินด้ายแดง ปรับได้ 4 ทิศทาง พร้อมปุ่มควบคุมเครื่องเสียง หน้าจอ TFT และระบบ Cruise Control
• มาตรวัดพร้อมหน้าจอแสดงข้อมูลการขับขี่แบบดิจิทัล TFT สีส้มสไตล์ RS
• หน้าจอสัมผัส Advanced Touch ขนาด 7 นิ้ว รองรับ Apple CarPlay, Android Auto, Bluetooth, USB และระบบสั่งการด้วยเสียง
• ระบบปรับอากาศแบบอัตโนมัติแยกอิสระซ้าย-ขวา (Dual Zone)
• ระบบกุญแจอัจฉริยะ Honda Smart Key System พร้อมปุ่ม Push Start Button
• ระบบสตาร์ทเครื่องยนต์พร้อมเปิดแอร์ด้วยรีโมท (Remote Engine Start) สบายใจยามจอดรถตากแดด
• เบรกมือไฟฟ้า (Electric Parking Brake) พร้อมระบบ Auto Brake Hold

👍 เทคโนโลยีความปลอดภัยขั้นสูง Honda SENSING และระบบความปลอดภัยรอบคัน:
• ระบบความปลอดภัย Honda SENSING ครบครัน:
  - ระบบเตือนการชนรถและคนเดินถนนพร้อมระบบช่วยเบรก (CMBS)
  - ระบบควบคุมความเร็วอัตโนมัติแบบแปรผัน พร้อมระบบปรับความเร็วตามรถคันหน้าที่ความเร็วต่ำ (ACC with LSF)
  - ระบบช่วยควบคุมรถให้อยู่ในช่องทางเดินรถ (LKAS)
  - ระบบเตือนและช่วยควบคุมเมื่อรถออกนอกช่องทางเดินรถ (RDM with LDW)
  - ระบบปรับไฟสูงอัตโนมัติ (AHB)
• ระบบแสดงภาพมุมอับสายตาขณะเปลี่ยนเลน (Honda LaneWatch)
• ถุงลมนิรภัย SRS 6 ตำแหน่ง (คู่หน้า, ด้านข้าง, และม่านถุงลม)
• ระบบเบรกป้องกันล้อล็อก ABS พร้อมระบบกระจายแรงเบรก EBD
• ระบบช่วยควบคุมการทรงตัวขณะเข้าโค้ง VSA และระบบช่วยออกตัวบนทางลาดชัน HSA
• กล้องมองภาพด้านหลังปรับมุมมอง 3 ระดับ (Multi-Angle Rearview Camera)
• กุญแจนิรภัย Immobilizer พร้อมระบบสัญญาณกันขโมย และระบบล็อกรถอัตโนมัติเมื่อกุญแจอยู่ห่างจากตัวรถ (Walk Away Auto Lock)
